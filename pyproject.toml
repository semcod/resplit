[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebuild"
version = "0.1.17"
description = "Historical deployment analysis — walk git history, deploy per day, test all endpoints, capture screenshots, restore working fragments"
readme = "README.md"
authors = [{ name = "Tom Sapletta", email = "tom@sapletta.com" }]
requires-python = ">=3.11"
keywords = ["deployment", "regression", "git", "testing", "endpoints", "history", "rebuild"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "gitpython>=3.1",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2",
    "deta>=0.1",         # infra scanning
    # "wup>=0.1",        # optional: regression watcher
    # "regres>=0.1",     # optional: regression analysis
    # "testql>=1.2",     # optional: endpoint testing DSL,
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
screenshots = ["playwright>=1.44"]
tui = ["textual>=0.60"]
semantic = ["sentence-transformers>=2.7"]
full = ["playwright>=1.44", "textual>=0.60", "sentence-transformers>=2.7", "wup", "regres", "testql"]
dev = ["pytest>=8", "pytest-cov", "pytest-asyncio", "ruff", "mypy",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]

[project.scripts]
rebuild = "rebuild.interfaces.cli:app"

[project.urls]
Homepage = "https://github.com/semcod/resplit"
Repository = "https://github.com/semcod/resplit"

[tool.setuptools.packages.find]
where = ["."]
include = ["rebuild*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"
norecursedirs = ["rebuild", "examples", ".rebuild", "dist", "build"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
