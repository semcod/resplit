[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rebuild"
version = "0.1.37"
description = "Historical deployment analysis — walk git history, deploy per day, test all endpoints, capture screenshots, restore working fragments"
readme = "README.md"
authors = [{ name = "Tom Sapletta", email = "tom@sapletta.com" }]
requires-python = ">=3.11"
keywords = ["deployment", "regression", "git", "testing", "endpoints", "history", "rebuild"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "gitpython>=3.1",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2",
    "deta>=0.1",         # infra scanning
    "astor>=0.8",        # code generation for refactor executor
    # "wup>=0.1",        # optional: regression watcher
    # "regres>=0.1",     # optional: regression analysis
    # "testql>=1.2.64; python_version < '3.14'",  # optional: endpoint testing DSL,
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]

license = "Apache-2.0"
[project.optional-dependencies]
screenshots = ["playwright>=1.44"]
tui = ["textual>=0.60"]
semantic = ["sentence-transformers>=2.7"]
watch = ["wup>=0.2.21"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "prometheus-client>=0.20"]
full = ["playwright>=1.44", "textual>=0.60", "sentence-transformers>=2.7", "wup>=0.2.21", "regres", "testql>=1.2.64; python_version < '3.14'", "fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "pytest-cov", "pytest-asyncio", "ruff", "mypy",
    "mutmut>=2.5",
    "goal>=2.1.0",
    "costs>=0.1.20",
    "pfix>=0.1.60",
]

[project.scripts]
rebuild = "rebuild.interfaces.cli:app"

[project.entry-points."rebuild.scanners"]

[project.entry-points."rebuild.reporters"]

[project.urls]
Homepage = "https://github.com/semcod/resplit"
Repository = "https://github.com/semcod/resplit"

[tool.setuptools.packages.find]
where = ["."]
include = ["rebuild*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -q"
norecursedirs = [".*", "rebuild", "examples", "dist", "build", "node_modules", "venv", "c2004", "restored_*", "*.egg-info"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.mutmut]
# Sprint 4b — Mutation testing on the domain layer.
#
# Run locally:    mutmut run --paths-to-mutate rebuild/domain/
# View results:   mutmut results
# Show a mutant:  mutmut show <id>
#
# CI runs nightly via .github/workflows/mutation.yml; results posted to
# docs/mutation_testing.md.
paths_to_mutate = "rebuild/domain/"
runner = "python -m pytest -x --tb=no -q"
tests_dir = "tests/"
# Skip noisy mutants in pure-data classes / event payloads.
also_copy = ["tests/", "pyproject.toml"]

[tool.pfix]
# Self-healing Python configuration
model = "openrouter/qwen/qwen3-coder-next"
auto_apply = true
auto_install_deps = true
auto_restart = false
max_retries = 3
create_backups = false
git_auto_commit = false

[tool.pfix.runtime_todo]
enabled = true
todo_file = "TODO.md"
min_severity = "low"
deduplicate = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
