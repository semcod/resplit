# rebuild — GitLab CI integration
#
# Usage: copy to .gitlab-ci.yml in your project (or include via `include:`).
# CUSTOMISE the marked sections for your stack.

stages:
  - scan

variables:
  PYTHON_VERSION: "3.11"
  # CUSTOMISE: health-check endpoint of your service
  HEALTH_URL: "http://localhost:8000/health"
  BASE_URL: "http://localhost:8000"

# ---------------------------------------------------------------------------
# MR scan — fast (no deploy)
# ---------------------------------------------------------------------------
rebuild:mr-scan:
  stage: scan
  image: python:${PYTHON_VERSION}-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: 50
  script:
    - pip install --no-cache-dir rebuild
    - rebuild walk . --dry-run --days 1 --deploy none --output .rebuild_mr
    - rebuild report --results-dir .rebuild_mr
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .rebuild_mr/
    expose_as: "rebuild MR scan"

# ---------------------------------------------------------------------------
# Scheduled nightly walk
# ---------------------------------------------------------------------------
rebuild:nightly:
  stage: scan
  image: python:${PYTHON_VERSION}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375/
    GIT_DEPTH: 0   # full history
  before_script:
    - pip install --no-cache-dir rebuild
    # CUSTOMISE: any docker-compose pre-setup, e.g. login to private registry
  script:
    - rebuild walk .
        --days 30
        --deploy docker-compose
        --health-url ${HEALTH_URL}
        --base-url ${BASE_URL}
        --health-timeout 120
        --output .rebuild_nightly
    - rebuild dashboard --results-dir .rebuild_nightly
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - .rebuild_nightly/
    expose_as: "rebuild nightly walk"

# Schedule via Project → CI/CD → Schedules:
# - Description:  rebuild nightly walk
# - Cron:         0 2 * * *
# - Variables:    (none — already in this file)
