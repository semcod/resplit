services:
  # PostgreSQL Database (optional — enable for PG mode)
  postgres:
    image: postgres:16-alpine
    container_name: c2004-postgres
    environment:
      - POSTGRES_DB=c2004
      - POSTGRES_USER=c2004
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - identification-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c2004"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-production}
        - VITE_SERVICE_VERSION=${VITE_SERVICE_VERSION:-}
        - VITE_CQL_IFRAME_URL=${VITE_CQL_IFRAME_URL:-}
        - VITE_ENABLE_CONNECT_ID_IFRAME_PILOT=${VITE_ENABLE_CONNECT_ID_IFRAME_PILOT:-false}
        - VITE_ENABLE_CONNECT_MANAGER_IFRAME_PILOT=${VITE_ENABLE_CONNECT_MANAGER_IFRAME_PILOT:-false}
        - VITE_ENABLE_CONNECT_SCENARIO_IFRAME_PILOT=${VITE_ENABLE_CONNECT_SCENARIO_IFRAME_PILOT:-true}
    container_name: identification-frontend
    ports:
      - "${FRONTEND_PORT:-8100}:80"
    # Port mapping defined in environment-specific override files
    # Production: See docker-compose.prod.yml
    # Development: See docker-compose.dev.yml
    environment:
      # In Docker, frontend should call backend via service name on container port 8000
      - VITE_API_URL=http://backend:8000
      - VITE_WS_URL=ws://backend:8000
      - VITE_CDN_URL=${VITE_CDN_URL:-http://localhost:9000}
      - VITE_LOG_LEVEL=${VITE_LOG_LEVEL:-info}
      - VITE_ENABLE_RFID=${ENABLE_RFID:-true}
      - VITE_ENABLE_QR=${ENABLE_QR:-true}
      - VITE_ENABLE_BARCODE=${ENABLE_BARCODE:-true}
      - VITE_ENABLE_MANUAL=${ENABLE_MANUAL:-true}
      - VITE_ENABLE_CONNECT_ID_IFRAME_PILOT=${VITE_ENABLE_CONNECT_ID_IFRAME_PILOT:-false}
      - VITE_ENABLE_CONNECT_MANAGER_IFRAME_PILOT=${VITE_ENABLE_CONNECT_MANAGER_IFRAME_PILOT:-false}
      - VITE_CQL_IFRAME_URL=${VITE_CQL_IFRAME_URL:-http://connect-scenario:80}
      - VITE_DOMAIN_CQL=${VITE_DOMAIN_CQL:-connect-scenario}
      # ADR-015 Phase 3 routing toggle via alternate nginx config file
      - IDENTIFICATION_NGINX_CONF=${IDENTIFICATION_NGINX_CONF:-./frontend/nginx.conf}
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ${IDENTIFICATION_NGINX_CONF:-./frontend/nginx.conf}:/etc/nginx/conf.d/default.conf:ro
    networks:
      - identification-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`identification.localhost`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: identification-backend
    init: true  # Reap zombie processes (chrome-headless etc.)
    ports:
      # Map host 8101 -> container 8000 (FastAPI listens on 8000)
      - "${BACKEND_PORT:-8101}:8000"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8101}
      - SERVICE_NAME=${SERVICE_NAME:-identification}
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.17}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=${API_WORKERS:-4}
      - API_RELOAD=${API_RELOAD:-false}
      - DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dcore%2Cpublic
      - CONFIG_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dconfig%2Cpublic
      - AUTH_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dauth%2Cpublic
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me-32-chars-min}
      # Allow local dev frontend by default; override CORS_ORIGINS to a JSON array string if needed
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:8100","http://identification.localhost"]}
      # No Redis needed for simple app
      - ENABLE_RFID=${ENABLE_RFID:-true}
      - ENABLE_QR=${ENABLE_QR:-true}
      - ENABLE_BARCODE=${ENABLE_BARCODE:-true}
      - ENABLE_MANUAL=${ENABLE_MANUAL:-true}
      - DEVTOOLS_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Ddevtools%2Cpublic
      - SCENARIO_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dscn%2Cshared%2Cpublic
      - MENU_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dmenu%2Cpublic
      - LOG_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dlogs%2Cpublic
      - CONNECT_SCENARIO_BACKEND_URL=http://connect-scenario-backend:8108
      - CONNECT_SCENARIO_TIMEOUT_SECONDS=7
      - CONNECT_TEST_BACKEND_URL=http://172.17.0.1:8119
      - CONNECT_TEST_TIMEOUT_SECONDS=7
      - CONNECT_ID_BACKEND_URL=http://172.17.0.1:8117
      - CONNECT_ID_TIMEOUT_SECONDS=5
      - CONNECT_MANAGER_BACKEND_URL=http://connect-manager-backend:8104
      - CONNECT_MANAGER_TIMEOUT_SECONDS=5
      - CONNECT_PROTOCOL_BACKEND_URL=http://connect-protocol-backend:8120
      - CONNECT_PROTOCOL_TIMEOUT_SECONDS=7
      - CONNECT_DATA_BACKEND_URL=http://connect-data-backend:8121
      - CONNECT_DATA_TIMEOUT_SECONDS=7
      - CONNECT_TEMPLATE_BACKEND_URL=http://172.19.0.1:8106
      - CONNECT_TEMPLATE_TIMEOUT_SECONDS=8
      - NFO_LEVEL=${NFO_LEVEL:-DEBUG}
      - NFO_ENV=${NFO_ENV:-docker}
      - PYTHONPATH=/workspace
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/api:/app/api:ro
      - ./archive/c2005:/app/c2005:ro
      - ./models:/workspace/models:ro
    networks:
      - identification-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v3/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api.identification.localhost`)"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"

  # Service-ID Pilot Backend (ADR-015 Phase 2)
  service-id-pilot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: service-id-pilot-backend
    init: true
    ports:
      - "${SERVICE_ID_PILOT_PORT:-8111}:8000"
    environment:
      - SERVICE_NAME=service-id-pilot
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.17}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=${API_WORKERS:-1}
      - API_RELOAD=false
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me-32-chars-min}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:8100","http://identification.localhost"]}
      - DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dcore%2Cpublic
      - AUTH_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dauth%2Cpublic
      - PYTHONPATH=/workspace
    command: ["/bin/sh", "-c", "uvicorn app.main_service_id_pilot:app --host 0.0.0.0 --port 8000 --workers 1"]
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/api:/app/api:ro
      - ./models:/workspace/models:ro
    networks:
      - identification-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v3/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Service-Manager Pilot Backend (next iframe/runtime extraction wave)
  service-manager-pilot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: service-manager-pilot-backend
    init: true
    ports:
      - "${SERVICE_MANAGER_PILOT_PORT:-8112}:8000"
    environment:
      - SERVICE_NAME=service-manager-pilot
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.17}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=${API_WORKERS:-1}
      - API_RELOAD=false
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me-32-chars-min}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:8100","http://identification.localhost"]}
      - DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dcore%2Cpublic
      - AUTH_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dauth%2Cpublic
      - PYTHONPATH=/workspace
    command: ["/bin/sh", "-c", "uvicorn app.main_service_manager_pilot:app --host 0.0.0.0 --port 8000 --workers 1"]
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/api:/app/api:ro
      - ./models:/workspace/models:ro
    networks:
      - identification-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v3/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Firmware Simulator - Port 8202
  firmware:
    build:
      context: .
      dockerfile: backend/firmware/Dockerfile
    container_name: test-simulator-firmware
    ports:
      - "8202:8202"
    volumes:
      - ./backend/firmware:/app
    environment:
      - SIMULATION_MODE=REALTIME
      - PHYSICS_TIMESTEP=0.01
      - SERVICE_VERSION=${SERVICE_VERSION:-1.0.17}
    networks:
      - identification-network
      - test-simulator-net
    restart: unless-stopped

  # ── Connect ID Backend (CQRS / Event Sourcing on PostgreSQL) ──
  connect-id-backend:
    build:
      context: .
      dockerfile: connect-id/backend/Dockerfile
    container_name: connect-id-backend
    ports:
      - "${CONNECT_ID_BACKEND_PORT:-8103}:8103"
    environment:
      - CONNECT_ID_BACKEND_HOST=0.0.0.0
      - CONNECT_ID_BACKEND_PORT=8103
      - CONNECT_ID_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004_identification
      - CONNECT_ID_EVENT_SUBSCRIBERS=http://connect-manager-backend:8104
      - MASKSERVICE_API_URL=http://backend:8000
    networks:
      - identification-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8103/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Connect Data Backend (facade runtime) ──
  # Exposes data read API consumed by legacy /api/v3/data customers/devices endpoints.
  connect-data-backend:
    build:
      context: .
      dockerfile: connect-data/backend/Dockerfile
    container_name: connect-data-backend
    ports:
      - "${CONNECT_DATA_BACKEND_PORT:-8121}:8121"
    environment:
      - CONNECT_DATA_BACKEND_HOST=0.0.0.0
      - CONNECT_DATA_BACKEND_PORT=8121
      - MASKSERVICE_API_URL=http://backend:8000
      - MASKSERVICE_TIMEOUT_SECONDS=7
    networks:
      - identification-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8121/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Connect Manager Backend (CQRS / Event Sourcing on PostgreSQL) ──
  connect-manager-backend:
    build:
      context: .
      dockerfile: connect-manager/backend/Dockerfile
    container_name: connect-manager-backend
    ports:
      - "${CONNECT_MANAGER_BACKEND_PORT:-8104}:8104"
    environment:
      - CONNECT_MANAGER_BACKEND_HOST=0.0.0.0
      - CONNECT_MANAGER_BACKEND_PORT=8104
      - CONNECT_MANAGER_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004_manager
      - MASKSERVICE_API_URL=http://backend:8000
    networks:
      - identification-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8104/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Connect Template Backend (CQRS / Event Sourcing on PostgreSQL) ──
  # Manages template JSON data, drafts and rendering
  connect-template-backend:
    build:
      context: .
      dockerfile: connect-template/backend/Dockerfile
    container_name: connect-template-backend
    ports:
      - "${CONNECT_TEMPLATE_BACKEND_PORT:-8106}:8106"
    environment:
      - CONNECT_TEMPLATE_BACKEND_HOST=0.0.0.0
      - CONNECT_TEMPLATE_BACKEND_PORT=8106
      - CONNECT_TEMPLATE_DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004_template
      - MASKSERVICE_API_URL=http://backend:8000
      - MASKSERVICE_TIMEOUT_SECONDS=8
    networks:
      - identification-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8106/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Connect Test Backend (CQRS / Event Sourcing runtime) ──
  # Exposes test-session orchestration API consumed by legacy /api/v3/test-sessions proxy.
  connect-test-backend:
    build:
      context: .
      dockerfile: connect-test/backend/Dockerfile
    container_name: connect-test-backend
    ports:
      - "${CONNECT_TEST_BACKEND_PORT:-8119}:8119"
    environment:
      - CONNECT_TEST_BACKEND_HOST=0.0.0.0
      - CONNECT_TEST_BACKEND_PORT=8119
      - MASKSERVICE_API_URL=http://backend:8000
    networks:
      - identification-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8119/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Connect Protocol Backend (CQRS / Event Sourcing runtime) ──
  # Exposes protocol orchestration API consumed by legacy /api/v3/protocols proxy.
  connect-protocol-backend:
    build:
      context: .
      dockerfile: connect-protocol/backend/Dockerfile
    container_name: connect-protocol-backend
    ports:
      - "${CONNECT_PROTOCOL_BACKEND_PORT:-8120}:8120"
    environment:
      - CONNECT_PROTOCOL_BACKEND_HOST=0.0.0.0
      - CONNECT_PROTOCOL_BACKEND_PORT=8120
      - DATABASE_URL=postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dcore%2Cpublic
      - FIRMWARE_BASE_URL=http://firmware:8080
      - MASKSERVICE_API_URL=http://backend:8000
    networks:
      - identification-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8120/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── CQL Backend - provides CQL/DSL parsing, validation, and execution ──
  # Migrated from /home/tom/github/oqlos/cql/backend into ./connect-scenario/cql-backend
  cql-backend:
    build:
      context: ./connect-scenario/cql-backend
      dockerfile: Dockerfile
    container_name: cql-backend
    ports:
      - "${CQL_BACKEND_PORT:-8101}:8101"
    environment:
      CQL_BACKEND_HOST: 0.0.0.0
      CQL_BACKEND_PORT: 8101
      CQL_BACKEND_LOG_LEVEL: ${CQL_BACKEND_LOG_LEVEL:-info}
      MASKSERVICE_API_URL: ${MASKSERVICE_API_URL:-http://backend:8000}
      SCENARIOS_DIR: /app/scenarios
    volumes:
      - ./connect-scenario/scenarios:/app/scenarios:ro
    depends_on:
      - backend
    networks:
      - identification-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8101/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

# ── Connect-Scenario Backend - scenario CRUD and management ──
  connect-scenario-backend:
    build:
      context: .
      dockerfile: connect-scenario/backend/Dockerfile
    container_name: connect-scenario-backend
    ports:
      - "${CONNECT_SCENARIO_BACKEND_PORT:-8108}:8108"
    environment:
      CONNECT_SCENARIO_BACKEND_HOST: 0.0.0.0
      CONNECT_SCENARIO_BACKEND_PORT: 8108
      CONNECT_SCENARIO_DATABASE_URL: ${CONNECT_SCENARIO_DATABASE_URL:-postgresql://c2004:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/c2004?options=-csearch_path%3Dcore%2Cpublic}
      OQLOS_API_URL: ${OQLOS_API_URL:-http://host.docker.internal:8202}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    networks:
      - identification-network
    restart: unless-stopped

# ── Connect-Scenario Service (CQL Editor with scenario management) ──
  connect-scenario:
    build:
      context: .
      dockerfile: connect-scenario/Dockerfile
    container_name: connect-scenario
    ports:
      - "${CONNECT_SCENARIO_PORT:-8096}:80"
    environment:
      CONNECT_SCENARIO_BACKEND_URL: ${CONNECT_SCENARIO_BACKEND_URL:-http://connect-scenario-backend:8108}
      CQL_BACKEND_URL: ${CQL_BACKEND_URL:-http://cql-backend:8101}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:8000}
      BACKEND_WS_URL: ${BACKEND_WS_URL:-http://backend:8000}
      CONNECT_SCENARIO_LISTEN_PORT: 80
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-'self' http://localhost:8100 http://*.localhost https://*.localhost}
    depends_on:
      - connect-scenario-backend
      - cql-backend
    networks:
      - identification-network
    restart: unless-stopped

  # Fleet Management (admin panel) is a SEPARATE project → cd ../fleet && make dev
  # No Redis needed for simple application

  # Traefik Reverse Proxy (optional, for production)
  traefik:
    image: traefik:v2.10
    container_name: identification-traefik
    ports:
      - "80:80"
      - "8080:8080"  # Dashboard
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - identification-network
    profiles:
      - production

networks:
  identification-network:
    driver: bridge
    name: identification-network
  test-simulator-net:
    driver: bridge
    name: test-simulator-network

volumes:
  pgdata:
  # backend-data: # Removed - using bind mount ./db:/data instead for consistency
