name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  validate:
    name: Validate tag version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag version: $TAG"

      - name: Verify version matches package
        run: |
          PKG_VERSION=$(python - <<'EOF'
          import re, pathlib
          text = pathlib.Path("rebuild/__init__.py").read_text()
          m = re.search(r'__version__\s*=\s*["\'](.+?)["\']', text)
          print(m.group(1) if m else "unknown")
          EOF
          )
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Package version: $PKG_VERSION"
          echo "Tag version:     $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Package version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest --tb=short -q

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate, test]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          python - <<'PYEOF' > release_notes.md
          import re, pathlib, sys
          version = "${{ needs.validate.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text()
          pattern = re.compile(
              rf"## \[{re.escape(version)}\].*?\n(.*?)(?=\n## \[|\Z)",
              re.DOTALL,
          )
          m = pattern.search(text)
          if m:
              print(m.group(1).strip())
          else:
              print(f"Release v{version}")
          PYEOF
          echo "Release notes written to release_notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: |
            dist/*.whl
            dist/*.tar.gz
