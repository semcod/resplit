name: Mutation Testing

# Sprint 4b — Nightly mutation analysis on the domain layer.
# Surviving mutants indicate gaps in test coverage that line/branch coverage
# alone cannot detect (semantic gaps).
#
# This workflow:
#   1. Runs at 03:00 UTC nightly (after Sprint 3 c2004 walk at 02:00).
#   2. Can be triggered manually via workflow_dispatch.
#   3. Posts the report as a build artifact + comment on the latest commit.
#
# We deliberately do NOT block PRs on mutation score — too slow (~30 min).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      paths:
        description: "Paths to mutate"
        required: false
        default: "rebuild/domain/"
      fast:
        description: "Skip slow tests (FAST=1)"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install rebuild + dev extras
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify baseline tests pass
        run: pytest -x -q

      - name: Run mutation analysis
        env:
          PATHS: ${{ github.event.inputs.paths || 'rebuild/domain/' }}
          FAST: ${{ github.event.inputs.fast == 'true' && '1' || '' }}
          SCORE_THRESHOLD: 75
        run: ./scripts/run_mutation_tests.sh
        continue-on-error: true   # we still want the report uploaded

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ github.run_id }}
          path: docs/mutation_results.md
          retention-days: 30

      - name: Upload mutmut cache (for incremental runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-cache-${{ github.run_id }}
          path: .mutmut-cache
          retention-days: 7
