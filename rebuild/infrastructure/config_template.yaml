# rebuild.yaml — Configuration & Workflow
# Generated by 'rebuild init'

project:
  name: "my-service"
  repo: "."

# 🛠️ Pipeline Workflow Configuration
# ------------------------------------------------------------------------------
# Workflow defines the sequence of execution and expected results.
workflow:
  modes:
    - walk: "Iterate through history and test each commit"
    - analyze: "Deep code analysis for duplicates and quality"
    - refactor: "Automated code evolution"
  
  expected_outputs:
    - ".rebuild/{date}/results.json": "Per-endpoint test results"
    - ".rebuild/{date}/report.html": "Visual report with screenshots"
    - ".rebuild/index.html": "Timeline view"
    - "history.jsonl": "Event-sourced pipeline log"

# 🚀 Deployment Settings
# ------------------------------------------------------------------------------
deploy:
  method: auto                    # auto | docker-compose | uvicorn | none
  compose_file: docker-compose.yml
  health_url: http://localhost:8003/api/health
  health_timeout: 60
  health_interval: 2

# 🔍 Scanning & Testing
# ------------------------------------------------------------------------------
scan:
  days: 30
  earliest_commit_per_day: true

testql:
  scenarios_dir: testql-scenarios/
  base_url: http://localhost:8003
  timeout: 10

# 🖼️ Output & Reports
# ------------------------------------------------------------------------------
output:
  dir: .rebuild
  screenshots: true
  html_report: true
  event_log: true                 # Enable history.jsonl Event Sourcing
