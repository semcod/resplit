# rebuild.yaml — Configuration & Workflow
# Generated by 'rebuild init'

project:
  name: "my-service"
  repo: "."

# 🛠️ Pipeline Workflow Configuration
# ------------------------------------------------------------------------------
# Workflow defines the sequence of execution and expected results.
workflow:
  modes:
    - walk: "Iterate through history and test each commit"
    - analyze: "Deep code analysis for duplicates and quality"
    - refactor: "Automated code evolution"
  
  expected_outputs:
    - ".rebuild/{date}/results.json": "Per-endpoint test results"
    - ".rebuild/{date}/report.html": "Visual report with screenshots"
    - ".rebuild/index.html": "Timeline view"
    - "history.jsonl": "Event-sourced pipeline log"

# 🚀 Deployment Settings
# ------------------------------------------------------------------------------
deploy:
  method: auto                    # auto | docker-compose | uvicorn | none
  compose_file: docker-compose.yml
  health_url: http://localhost:8003/api/health
  health_timeout: 60
  health_interval: 2
  health_verbose: false           # Log last health response/error on timeout
  retry_attempts: 1              # Deploy/reload retries with backoff
  retry_backoff_seconds: 2.0
  retry_backoff_multiplier: 2.0

# 🔍 Scanning & Testing
# ------------------------------------------------------------------------------
scan:
  days: 30
  earliest_commit_per_day: true

testql:
  scenarios_dir: testql-scenarios/
  base_url: http://localhost:8003
  timeout: 10

# Optional test payloads for mutation endpoints.
# Key formats supported:
# - "POST /api/items"
# - "/api/items"
test_bodies:
  "POST /api/items":
    name: demo-item
    enabled: true

# Token-based authentication (login once, propagate Bearer token to all requests)
login_url: http://localhost:8003/api/auth/login
login_payload:
  username: admin
  password: secret

# Manual overrides for fixing historical bugs
# Files from this directory are copied to the clone before deploy
patch_dir: .rebuild/patch

# ⚡ Accelerator Mode (10x Speed)
# ------------------------------------------------------------------------------
# Ultra-fast execution using worktrees + hot reload + parallel testing.
# Use: rebuild accelerator --days 30
#
accelerator:
  enabled: false                # Enable 10x mode (separate CLI command preferred)
  db_container: db              # Name of DB container for snapshots
  db_type: postgres               # postgres | mysql | sqlite
  max_parallel_tests: 10          # Concurrent endpoint tests
  smart_select: true              # Only test endpoints affected by git diff
  keep_alive: true                # Keep containers running after walk

# 🖼️ Output & Reports
# ------------------------------------------------------------------------------
output:
  dir: .rebuild
  screenshots: true
  html_report: true
  event_log: true                 # Enable history.jsonl Event Sourcing
